name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project sources
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create dummy secrets.properties and google-services.json for CI
      run: |
        if [ -f "secrets.defaults.properties" ]; then
          cp secrets.defaults.properties secrets.properties
        else
          echo "BASE_URL=https://api.example.com/" > secrets.properties
        fi

        echo '{
          "project_info": {
            "project_number": "1234567890",
            "project_id": "dummy-project"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890",
                "android_client_info": {
                  "package_name": "com.example.yakallim"
                }
              },
              "api_key": [
                {
                  "current_key": "dummy-api-key"
                }
              ],
              "services": {
                "appinvite_service": {
                  "status": 1
                }
              }
            }
          ],
          "configuration_version": "1"
        }' > app/google-services.json

    # build는 release 변형까지 테스트·lint·assemble하므로, 배포에 쓰는 debug 변형만 검사한다.
    - name: Test, lint and assemble (debug)
      run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

    - name: Generate Job Summary
      if: always()
      run: |
        # 테스트 결과 XML에서 실제 개수를 집계한다. 빌드가 테스트 전에 실패하면 결과 파일이 없다.
        shopt -s nullglob
        reports=(app/build/test-results/testDebugUnitTest/*.xml)
        count() { grep -ho " $1=\"[0-9]*\"" "${reports[@]}" | grep -o '[0-9]*' | awk '{ s += $1 } END { print s + 0 }'; }
        if [ ${#reports[@]} -eq 0 ]; then
          tests="Not run"
        else
          tests="$(count tests) run, $(count failures) failed, $(count errors) errors, $(count skipped) skipped"
        fi
        echo "### Workflow Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Workflow** | ${{ github.workflow }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Trigger Event** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Tests** | ${tests} |" >> $GITHUB_STEP_SUMMARY

  trigger-jenkins:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Generic Webhook
        run: >
          curl -sS --fail-with-body -X POST "${{ secrets.JENKINS_WEBHOOK_URL }}?token=${{ secrets.JENKINS_TRIGGER_TOKEN }}"
          -H "Content-Type: application/json"
          -d '{"ref": "${{ github.ref }}", "repository": "${{ github.repository }}", "commit": "${{ github.sha }}"}'
